<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Goodwork business card</title>
<style>
  /* VistaPrint standard business card: trim 3.5 x 2 in, bleed 0.125 in, safe zone 0.125 in inside trim. */
  @font-face { font-family: "Source Serif 4"; src: url("fonts/SourceSerif4-Semibold.otf") format("opentype"); font-weight: 600; }
  @page { size: 3.75in 2.25in; margin: 0; }
  :root {
    --ink: #1E2D2A; --gold: #B9822A; --cream: #F5F0E6; --paper: #FBF8F2; --stone: #5F5E57; --linen-300: #E3DCCD;
    --serif: "Source Serif 4", Georgia, serif;
    --sans: "Inter", Arial, sans-serif;
    --bleed: 0.125in; --safe: 0.25in;
  }
  html, body { margin: 0; padding: 0; }
  body { width: 3.75in; height: 2.25in; overflow: hidden; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .card { position: relative; width: 3.75in; height: 2.25in; }

  /* FRONT */
  .front { background: var(--ink); color: var(--cream); }
  .front .lockup { position: absolute; left: var(--safe); right: var(--safe); top: 0.62in; display: flex; justify-content: center; align-items: center; gap: 0.17in; }
  .front .mark { width: 0.46in; height: 0.46in; }
  .front .wordmark { font: 600 30pt/1 var(--serif); letter-spacing: -0.01em; color: var(--cream); }
  .front .tagline { position: absolute; left: var(--safe); right: var(--safe); bottom: 0.42in; text-align: center; font: 400 9.5pt/1.3 var(--sans); color: #D9D3C4; letter-spacing: 0.01em; }

  /* BACK */
  .back { background: var(--paper); color: var(--ink); }
  .back .mark { position: absolute; top: 0.38in; right: 0.40in; width: 0.30in; height: 0.30in; }
  .back .details { position: absolute; left: 0.40in; top: 0.70in; }
  .back .name { font: 600 15pt/1.15 var(--serif); letter-spacing: -0.01em; margin: 0; }
  .back .title { font: 400 7.5pt/1.3 var(--sans); color: var(--stone); margin: 0.04in 0 0.12in; }
  .back .contact { font: 400 8pt/1.55 var(--sans); margin: 0; }
  .back .contact span { display: block; }
  .back .url { color: var(--stone); }
  .back .rule { position: absolute; left: 0.40in; right: 0.40in; bottom: 0.40in; height: 1px; background: var(--linen-300); }

  /* Proof guides (not in print files) */
  .guides { display: none; position: absolute; inset: 0; pointer-events: none; }
  .proof .guides { display: block; }
  .guides .trim { position: absolute; inset: var(--bleed); border: 1px dashed rgba(220,40,40,.9); }
  .guides .safe { position: absolute; inset: var(--safe); border: 1px dashed rgba(40,120,220,.9); }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="guides"><div class="trim"></div><div class="safe"></div></div>
</div>
<script>
  const params = new URLSearchParams(location.search);
  const side = params.get('side') || 'front';
  const card = document.getElementById('card');
  card.classList.add(side);
  if (params.get('proof')) document.body.classList.add('proof');
  const mark = (inkFill) => `<svg class="mark" viewBox="0 0 48 48" aria-hidden="true">
    <rect fill="${inkFill}" x="4" y="4" width="17" height="12" rx="2.5"/>
    <rect fill="${inkFill}" x="27" y="4" width="17" height="12" rx="2.5"/>
    <rect fill="#B9822A" x="4" y="22" width="17" height="22" rx="2.5"/>
    <rect fill="${inkFill}" x="27" y="22" width="17" height="22" rx="2.5"/></svg>`;
  const front = `<div class="lockup">${mark('#F5F0E6')}<div class="wordmark">Goodwork</div></div>
    <div class="tagline">Software for those doing good</div>`;
  const back = `${mark('#1E2D2A')}
    <div class="details">
      <p class="name">Quinntyne Brown</p>
      <p class="title">Founder</p>
      <p class="contact"><span>hello@goodwork.rocks</span><span class="url">goodwork.rocks</span></p>
    </div>
    <div class="rule"></div>`;
  card.insertAdjacentHTML('afterbegin', side === 'back' ? back : front);
</script>
</body>
</html>
